<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One year of us</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Playfair+Display:ital@1&display=swap">
<style>
:root{--bg:#fde4ed;--bg2:#f9c6d9;--card:#fff8fb;--ink:#5a2a3f;--line:#3a2a30;--rose:#e0497a;--rd:#c2386a;--mint:#7fd3a1;--cheek:#ff9db8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1522;--bg2:#40202f;--card:#4a2838;--ink:#ffe1ec;--rd:#ff8fb3}}
:root[data-theme="dark"]{--bg:#2b1522;--bg2:#40202f;--card:#4a2838;--ink:#ffe1ec;--rd:#ff8fb3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background-color:var(--bg);background-image:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%);color:var(--ink);font:500 17px/1.4 Fredoka,ui-rounded,system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;border:0}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.fh{position:absolute;bottom:-30px;color:var(--rose);opacity:.35;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) rotate(40deg)}}
#app{position:relative;height:100%;z-index:1}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;overflow-y:auto;opacity:0;pointer-events:none;transform:scale(.96);transition:opacity .5s,transform .5s}
.scene.on{opacity:1;pointer-events:auto;transform:none}
.q{font-weight:600;font-size:24px;line-height:1.2;color:var(--rd);min-height:1.3em}
.note{opacity:.75;font-size:15px}
.cat{width:min(46vw,180px);height:auto;overflow:visible}
.pal{width:64px;height:auto;overflow:visible}
.w{fill:#fff;stroke:var(--line);stroke-width:2.5;stroke-linejoin:round}
.w.b{fill:#f3d3b8}
.ln{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
.hr{fill:var(--rose);stroke:var(--line);stroke-width:2.5;stroke-linejoin:round}
.ch{fill:var(--cheek);opacity:.7}
.mk{fill:var(--line)}
.cat .e,.cat .pw,.cat .ht,.cat .mk{display:none}
.cat.n .e.n,.cat.k .e.k,.cat.l .e.l,.cat.s .pw,.cat.k .mk,.cat.l .ht{display:inline}
.cat.k .m{display:none}
.e.n circle,.e.k circle:nth-child(n+3){fill:var(--line)}
.e.n{transform-origin:60px 64px;animation:blink 4s infinite}
.bob{transform-origin:60px 100px;animation:bob 2.6s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;width:100%}
.btn{color:#fff;border-radius:14px;font-weight:600;transition:all .35s cubic-bezier(.3,1.4,.5,1);box-shadow:0 4px 0 rgba(0,0,0,.15)}
#yes{--g:0;background:var(--mint);width:calc(100px + var(--g)*46px);max-width:92%;height:calc(44px + var(--g)*22px);font-size:calc(18px + var(--g)*7px)}
#no{background:var(--rose);padding:10px 24px;font-size:18px}
.bigheart{background:none;color:var(--rose);font-size:92px;line-height:1;animation:beat 1.3s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.gifts{display:flex;gap:12px;justify-content:center}
.gift{position:relative;background:none;width:84px;color:var(--rd);font-weight:600;font-size:14px;animation:wig 2.4s ease-in-out infinite;animation-delay:var(--d)}
.gift svg{width:100%;display:block}
.gb{fill:#f4a3c0;stroke:var(--rd);stroke-width:2.5}
.rb{fill:#ffd6e4;stroke:var(--rd);stroke-width:2.5;stroke-linejoin:round}
.tick{position:absolute;top:0;right:2px;width:22px;height:22px;border-radius:50%;background:var(--mint);color:#fff;font-style:normal;line-height:22px;font-size:13px;opacity:0;transition:.3s}
.gift.done .tick{opacity:1}
@keyframes wig{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-6deg)}84%{transform:rotate(6deg)}92%{transform:rotate(-3deg)}}
.count{display:none;background:var(--card);border-radius:18px;padding:12px 16px;box-shadow:0 6px 18px rgba(194,56,106,.18)}
.count.on{display:block;animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.count small{display:block;color:var(--rd)}
.cn{display:flex;gap:12px;justify-content:center;margin-top:4px}
.cn div{min-width:44px}.cn b{display:block;font-size:26px}.cn span{font-size:12px;opacity:.8}
#panel{position:fixed;inset:0;z-index:20;background-color:var(--bg);display:none;flex-direction:column;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#panel.on{display:flex;animation:fin .4s}
@keyframes fin{from{opacity:0;transform:scale(.96)}}
#pb{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.t{margin:0;font:italic 400 22px 'Playfair Display',Georgia,serif;color:var(--rd);text-align:center}
.back{background:var(--rose);padding:8px 24px;flex:none}
.wall{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%;max-width:420px;padding:8px 0}
.pol{width:44%;background:#fff;padding:7px 7px 5px;border-radius:3px;box-shadow:0 4px 12px rgba(0,0,0,.2);transform:rotate(var(--r));color:#4a2c3a;cursor:pointer;transition:transform .4s cubic-bezier(.3,1.5,.5,1);animation:drop .7s cubic-bezier(.3,1.3,.5,1) backwards;animation-delay:var(--dl)}
.pol.big{transform:rotate(0) scale(1.28);z-index:5}
.ph{aspect-ratio:1;background:linear-gradient(#bfe4fa 58%,#9bd68a 58%) center/cover}
.pol p{margin:5px 0 0;font:italic 15px/1.2 'Playfair Display',Georgia,serif}
.pol small{display:block;font-size:11px;opacity:.6}
@keyframes drop{from{transform:translateY(-110vh) rotate(25deg)}}
.player{position:relative;width:min(70vw,260px);aspect-ratio:1}
.rec{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(#111 0 2px,#222 3px 4px);box-shadow:0 10px 24px rgba(0,0,0,.3);display:grid;place-items:center;animation:spin 3s linear infinite;animation-play-state:paused}
.rec.spin{animation-play-state:running}
.rec i{width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 8%,#f4a3c0 9%);border:3px solid rgba(255,255,255,.3)}
@keyframes spin{to{transform:rotate(360deg)}}
.arm{position:absolute;right:-4%;top:-4%;width:7px;height:54%;background:#f4a3c0;border-radius:4px;transform-origin:50% 0;transform:rotate(-24deg);transition:transform .8s}
.arm.on{transform:rotate(12deg)}
.deck{display:flex;align-items:center;gap:12px;background:#f4a3c0;border-radius:16px;padding:10px;width:min(86vw,320px)}
.art{flex:1;border-radius:10px;padding:10px;text-align:left;background:linear-gradient(135deg,#ff9db8,#ffb86b 60%,#7a5cff);color:#fff;font-weight:600;line-height:1.2}
.art span{display:block;font-size:13px;font-weight:400}
#pp{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--rose);font-size:16px}
.letter{position:relative;width:min(92vw,400px);background:var(--card);border-radius:10px;padding:26px 20px 18px;box-shadow:0 8px 24px rgba(0,0,0,.18);text-align:left;font:italic 15.5px/1.65 'Playfair Display',Georgia,serif;margin:14px 0}
.letter h3{margin:0 0 8px;font-size:18px;font-weight:400;color:var(--rd)}
.letter p{margin:0;white-space:pre-wrap;min-height:6em}
.letter p:not(.dn)::after{content:"▍";animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.sig{text-align:right;margin-top:10px;opacity:0;transition:opacity 1s;color:var(--rd)}
.dn+.sig{opacity:1}
.lip{position:absolute;width:30px;fill:var(--rose);opacity:.85}
.pals{display:flex;gap:14px;align-items:flex-end;opacity:0;transition:opacity 1s}
.pals.show{opacity:1}
.pals .cat,.pals .pal{width:72px}
#mute{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;width:38px;height:38px;border-radius:50%;background:var(--card);color:var(--rd);box-shadow:0 2px 8px rgba(0,0,0,.15)}
#mute.off{opacity:.45}
.th{position:fixed;color:var(--rose);font-size:22px;pointer-events:none;z-index:60;transform:translate(-50%,-50%);animation:tp .9s ease-out forwards}
@keyframes tp{to{transform:translate(-50%,-200%) scale(1.5);opacity:0}}
.cf{position:fixed;left:50%;top:60%;width:9px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fly 1.4s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{40%{transform:translate(calc(var(--x)*.7),var(--y))}to{transform:translate(var(--x),calc(var(--y)*-.3 + 260px)) rotate(var(--r));opacity:0}}
.blob{position:absolute;border-radius:50%;opacity:.5;background:var(--cheek);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.2)}}
.st{position:absolute;color:#fff;font-style:normal;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.cloud{position:absolute;width:90px;height:28px;background:#fff;border-radius:30px;opacity:.7;animation:cl 40s linear infinite}
.cloud::before{content:"";position:absolute;left:18px;top:-14px;width:36px;height:36px;border-radius:50%;background:#fff}
@keyframes cl{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
#hills{position:absolute;left:0;bottom:0;width:100%;height:110px}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(8deg)}}
#wipe{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(circle at 50% 55%,var(--rose),var(--cheek));clip-path:circle(0 at 50% 55%)}
#wipe.run{animation:wp .95s ease-in-out}
@keyframes wp{0%{clip-path:circle(0 at 50% 55%);opacity:1}50%{clip-path:circle(150% at 50% 55%);opacity:1}100%{clip-path:circle(150% at 50% 55%);opacity:0}}
.lw{display:inline-block;animation:lt .5s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes lt{from{transform:translateY(14px) scale(.3);opacity:0}}
.tail{transform-origin:78px 108px;animation:tail 1.6s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 5s infinite}
@keyframes ear{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-9deg)}}
.cat.k .bob,.cat.s .bob{animation:shk .35s infinite}
@keyframes shk{25%{transform:translateX(-3px) rotate(-2deg)}75%{transform:translateX(3px) rotate(2deg)}}
.cat.l .bob{animation:hug 1s ease-in-out infinite}
@keyframes hug{50%{transform:translateY(-8px) scale(1.04)}}
.sw{display:none;fill:#8fd3ff;stroke:var(--line);stroke-width:2;animation:sw 1s infinite}
.cat.k .sw{display:inline}
@keyframes sw{to{transform:translateY(14px);opacity:0}}
.fh2{fill:var(--rose);font-size:13px;opacity:0;animation:fl2 2s ease-out infinite}
@keyframes fl2{from{transform:translateY(14px);opacity:1}to{transform:translateY(-16px);opacity:0}}
#s0.on .cat{animation:rin .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes rin{from{transform:translateY(80px) scale(.6);opacity:0}}
.bigheart{position:relative}
.bigheart::after{content:"";position:absolute;inset:18% 12%;border:3px solid var(--rose);border-radius:50%;animation:rip 1.8s infinite}
@keyframes rip{from{transform:scale(.8);opacity:.7}to{transform:scale(2.2);opacity:0}}
#yes{animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 4px 0 rgba(0,0,0,.15),0 0 0 10px rgba(127,211,161,.35)}}
#s1.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.scene.on .gift{animation:gin .8s cubic-bezier(.3,1.5,.5,1) backwards,wig 2.4s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + 1s)}
@keyframes gin{from{transform:translateY(-60vh) scale(.5);opacity:0}}
.lid{transform-box:fill-box;transform-origin:0 100%}
.gift.open .lid{animation:lid .55s forwards}
@keyframes lid{to{transform:translateY(-26px) rotate(-28deg)}}
.gift.open svg{animation:sh .5s}
.pol{position:relative}
.pol::before{content:"";position:absolute;top:-9px;left:50%;width:46px;height:16px;background:rgba(255,200,220,.85);transform:translateX(-50%) rotate(-3deg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.rec::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 20%,rgba(255,255,255,.18) 25%,transparent 32% 70%,rgba(255,255,255,.14) 76%,transparent 82%)}
.eq{display:flex;gap:4px;align-items:flex-end;height:30px}
.eq b{width:6px;height:6px;border-radius:3px;background:var(--rose)}
.eq.on b{animation:eq .6s ease-in-out infinite alternate}
.eq.on b:nth-child(2n){animation-delay:.2s}.eq.on b:nth-child(3n){animation-delay:.4s}
@keyframes eq{to{height:28px}}
.nt{position:absolute;top:10%;color:var(--rose);font-size:22px;font-style:normal;pointer-events:none;animation:nt 2.4s ease-out forwards}
@keyframes nt{to{transform:translate(30px,-90px) rotate(20deg);opacity:0}}
.letter{animation:unf .9s cubic-bezier(.3,1.3,.5,1);transform-origin:50% 0}
@keyframes unf{from{transform:scaleY(.05);opacity:0}}
.pals.show svg{animation:pop .6s cubic-bezier(.3,1.6,.5,1) backwards}
.pals.show svg:nth-child(2){animation-delay:.15s}.pals.show svg:nth-child(3){animation-delay:.3s}
.cn div:last-child b{animation:tk .4s}
@keyframes tk{from{transform:translateY(-8px) scale(1.25);color:var(--rose)}}
.scene{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
#wipe{will-change:clip-path,opacity}
#wipe.run{animation:wp2 1s ease-in-out}
@keyframes wp2{0%{clip-path:circle(0 at 50% 55%);opacity:1}45%,55%{clip-path:circle(150% at 50% 55%);opacity:1}100%{clip-path:circle(150% at 50% 55%);opacity:0}}
.cat .zt,.cat .wp,.cat .cd{display:none}
.cat.zz .e.n{display:none}
.cat.zz .e.z,.cat.zz .zt,.cat.hi .wp,.cat.pn .cd,.cat.pn .e.n{display:inline}
.cat.pn .cd{animation:pop .4s}
.wp{transform-origin:88px 104px;animation:wv .45s ease-in-out infinite alternate}
@keyframes wv{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.zt{fill:var(--rd);font-size:14px;opacity:0;animation:zz 2.4s infinite}
@keyframes zz{from{transform:translate(0,6px);opacity:1}to{transform:translate(14px,-22px);opacity:0}}
.cat.zz .bob{animation:slp 3s ease-in-out infinite}
@keyframes slp{50%{transform:scale(1.03,.97)}}
.cat.hop .bob{animation:hop .6s 2}
@keyframes hop{40%{transform:translateY(-16px) scale(.96,1.05)}70%{transform:translateY(0) scale(1.06,.94)}}
.cat.tilt .bob{animation:tl 1.8s}
@keyframes tl{20%,80%{transform:rotate(-7deg) translateX(-3px)}}
.cat.boing .bob{animation:boing .7s}
@keyframes boing{25%{transform:scale(1.18,.8)}50%{transform:scale(.88,1.15) translateY(-12px)}75%{transform:scale(1.05,.97)}}
.cat.boing .ch{opacity:1}
.cat.l .tail{animation-duration:.4s}
.w{fill:url(#gw)}
.w.b{fill:url(#gb)}
.cat,.pal{transform:perspective(520px) rotateY(calc(var(--px,0)*12deg)) rotateX(calc(var(--py,0)*-8deg))}
.hd{transform:translate(calc(var(--px,0)*2.5px),calc(var(--py,0)*1.5px))}
.fc{transform:translate(calc(var(--px,0)*6px),calc(var(--py,0)*3.5px))}
.gs{fill:rgba(90,42,63,.22);transform-origin:60px 124px;animation:gsh 2.6s ease-in-out infinite}
@keyframes gsh{50%{transform:scale(.86);opacity:.7}}
.blob{filter:none;background:radial-gradient(circle,var(--cheek),transparent 70%)}
#wipe{inset:auto;left:50%;top:55%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;clip-path:none;transform:scale(0);will-change:transform,opacity}
#wipe.boot{transform:scale(18)}
#wipe.out{opacity:0;transition:opacity .9s}
#wipe.run{animation:wp3 .9s ease-in-out}
@keyframes wp3{0%{transform:scale(0);opacity:1}35%,45%{transform:scale(18);opacity:1}100%{transform:scale(18);opacity:0}}
.scene.on .cat{animation:rin .8s cubic-bezier(.3,1.5,.5,1) .3s backwards}
.scene.on .gift{animation-delay:calc(var(--d) + .3s),calc(var(--d) + 1.5s)}
.wp{transform-origin:90px 106px;animation-name:wv2}
@keyframes wv2{from{transform:rotate(10deg)}to{transform:rotate(40deg)}}
.cat.k .ear,.cat.s .ear{animation:none;transform:rotate(var(--dr))}
@media (prefers-reduced-motion:reduce){#s1.shake{animation:none}}

/* ===== AMPED UP: richer living world ===== */
.moon{position:absolute;top:7%;right:9%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fffdf5,#ffe9a8 55%,#ffd166);box-shadow:0 0 24px 6px rgba(255,214,102,.55),0 0 80px 30px rgba(255,214,102,.18);animation:moonbob 6s ease-in-out infinite}
@keyframes moonbob{50%{transform:translateY(-6px)}}
.aurora{position:absolute;width:120vw;height:60vh;border-radius:50%;opacity:.45;pointer-events:none}
.aurora.a1{top:-18%;left:-30%;background:radial-gradient(circle,#ffb3d1,transparent 65%);animation:aur 18s ease-in-out infinite alternate}
.aurora.a2{bottom:-25%;right:-30%;background:radial-gradient(circle,#a8d8ff,transparent 65%);animation:aur 22s ease-in-out infinite alternate-reverse}
@keyframes aur{to{transform:translate(60px,30px) scale(1.15)}}
.rainbow{position:absolute;left:50%;bottom:-40px;width:340px;height:170px;margin-left:-170px;border-radius:170px 170px 0 0;border:10px solid transparent;border-top-color:rgba(255,157,184,.4);border-left-color:rgba(255,209,102,.32);border-right-color:rgba(127,211,161,.32);opacity:.55}
.petal{position:absolute;top:-24px;font-style:normal;color:#ff9db8;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(320deg)}}
.shoot{position:absolute;width:90px;height:2px;background:linear-gradient(90deg,#fff,transparent);border-radius:2px;opacity:0;transform:rotate(-32deg);animation:shoot 1.1s ease-out forwards}
@keyframes shoot{0%{opacity:0;transform:rotate(-32deg) translateX(0)}15%{opacity:1}100%{opacity:0;transform:rotate(-32deg) translateX(-260px)}}
.firefly{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(255,233,168,.8);animation:fly 9s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(30px,-40px)}50%{transform:translate(-20px,-70px)}75%{transform:translate(40px,-30px)}100%{transform:translate(0,0)}}
.bfly{position:absolute;font-style:normal;font-size:20px;pointer-events:none;animation:bfly 11s ease-in-out infinite}
@keyframes bfly{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(60px,-50px) rotate(20deg)}50%{transform:translate(20px,-110px) rotate(-15deg)}75%{transform:translate(-40px,-60px) rotate(10deg)}100%{transform:translate(0,0) rotate(0)}}
.badge{display:inline-block;font-weight:600;letter-spacing:.28em;font-size:13px;color:#fff;background:linear-gradient(90deg,#e0497a,#ff8fb3,#e0497a);background-size:200% 100%;padding:7px 16px 6px 19px;border-radius:999px;box-shadow:0 4px 14px rgba(224,73,122,.45);animation:shim 3s linear infinite}
@keyframes shim{to{background-position:200% 0}}
.sub{font-size:16px;opacity:.85}
.sub b{color:var(--rd)}
.halo::before,.halo::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(224,73,122,.5);animation:halo 2s ease-out infinite}
.halo::after{animation-delay:1s}
@keyframes halo{from{transform:scale(.7);opacity:.9}to{transform:scale(1.6);opacity:0}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0%,transparent 70%);opacity:0;pointer-events:none;z-index:45}
.flash.go{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.count{border:2px solid rgba(224,73,122,.35)}
.count b{background:linear-gradient(180deg,var(--rd),#e0497a);-webkit-background-clip:text;background-clip:text;color:transparent}
.gift{filter:drop-shadow(0 6px 10px rgba(194,56,106,.25))}
.gift::after{content:"✦";position:absolute;top:-8px;left:50%;color:#ffd166;font-size:16px;animation:tw 1.6s ease-in-out infinite}
.seal{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8fb3,#c2386a 70%);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 8px rgba(0,0,0,.3);transform:rotate(-8deg)}
.player::after{content:"";position:absolute;inset:-30px;background:radial-gradient(circle,rgba(255,157,184,.35),transparent 65%);pointer-events:none;animation:pulse 3s ease-in-out infinite}

.scene.on .cat{filter:drop-shadow(0 8px 14px rgba(194,56,106,.25))}

.aurora{filter:none;opacity:.38}

.moon{background:radial-gradient(circle at 38% 35%,#fffdf5,#fff3cf 55%,#ffe9a8);box-shadow:0 0 20px 4px rgba(255,233,168,.5),0 0 60px 18px rgba(255,233,168,.15)}

.e.n circle.hl{fill:#fff}
.cat .tail{animation-duration:2.2s}

/* ===== V5: mochi cat blush sparkles ===== */
.chd{fill:#fff;opacity:.9}

/* ===== V6: generated cat frames ===== */
.cat{position:relative;display:inline-block}
.cat>img{display:block;width:100%;height:auto;animation:catbob 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes catbob{50%{transform:translateY(-4px) scale(1.02)}}
.cat.k>img,.cat.s>img,.cat.pn>img{animation:shk .35s infinite}
.cat.l>img{animation:hug 1s ease-in-out infinite}
.cat.zz>img{animation:slp 3s ease-in-out infinite}
.cat.hop>img{animation:hop .6s 2}
.cat.tilt>img{animation:tl 1.8s}
.cat.boing>img{animation:boing .7s}
.cat .ov{display:none;position:absolute;font-style:normal;pointer-events:none;z-index:2}
.cat.l .ov.ht{display:block;color:var(--rose);animation:ovf 1.8s ease-in-out infinite}
.cat.l .ov.h1{left:-4%;top:6%;font-size:20px}
.cat.l .ov.h2{right:-2%;top:-2%;font-size:15px;animation-delay:.6s}
.cat.l .ov.h3{left:40%;top:-14%;font-size:13px;animation-delay:1.1s}
.cat.pn .ov.sw{display:block;right:0;top:4%;font-size:22px;animation:ovf 1s infinite}
@keyframes ovf{50%{transform:translateY(-8px) rotate(12deg)}}
.pals .cat .ov{display:none}
.pals.show .cat{animation:pop .6s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:.15s}
</style>
</head>

<script>
/* =====================================================================
   EDIT THIS BLOCK ONLY. Everything personal lives here.
   - Keep the quote marks "" and the commas , exactly as they are.
   - Use ’ (curly) for apostrophes, and never type a straight " inside text.
   - Photos: put image files in the photos folder, then write "photos/photo1.jpg".
     Leave src as "" and a cute placeholder shows instead.
   - To add a photo, copy one whole { ... }, line. To remove one, delete it.
   - Letter: just type or paste your own words between the two ` marks below.
     Press Enter for new paragraphs. Don’t use the ` mark or ${ inside the letter.
   - Song: put an mp3 in the music folder and write "music/song.mp3".
   - anniversaryDate is the day they got together, written year-month-day.
   ===================================================================== */
const CONFIG = {
  herName: "Her Name",              // her name (opening screen)
  hisName: "His Name",              // your name (signs the letter)
  anniversaryDate: "2025-11-21",    // your anniversary date, YYYY-MM-DD
  openingNote: "Open when alone",   // note under the heart button
  question: "Do you love me?",      // the big question
  noLines: ["Wait\u2026 are you sure?", "nah that\u2019s not right\u2026", "be serious\u2026", "okay now you\u2019re just playing\u2026", "okay last chance\u2026"],  // what it says each time she taps NO
  yesLine: "I knew you\u2019d say yes", // shows after she taps YES
  photosTitle: "Captured memories", // title above the photo wall
  photos: [                        // PHOTOS: swap the files in the photos/ folder
    { src: "photos/photo1.jpg", caption: "Our first date", date: "21 Nov 2025" },
    { src: "photos/photo2.jpg", caption: "That silly day", date: "Add a date" },
    { src: "photos/photo3.jpg", caption: "My favourite smile", date: "Add a date" },
    { src: "photos/photo4.jpg", caption: "Our little trip", date: "Add a date" },
    { src: "photos/photo5.jpg", caption: "Just us", date: "Add a date" },
    { src: "photos/photo6.jpg", caption: "Here\u2019s to more", date: "21 Nov 2026" }
  ],
  song: { heading: "A song that reminds me of us", title: "Song name", artist: "Artist name", file: "music/song.mp3" },  // SONG: replace music/song.mp3 with your song file
  letter: {
    to: "Dear Love,",
    body: `Write your own words here. This box is free-form: just type or paste, press Enter for a new paragraph, and don\u2019t worry about quotes or commas.

Tell her what this year meant to you, one memory you love, and what you\u2019re looking forward to next.`,
    sign: "Forever yours"
  },
  counterLabel: "together for"
};
/* ===================== end of the part to edit ===================== */

const $ = s => document.querySelector(s), C = CONFIG;
const esc = t => String(t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const cat = p => `<span class="cat ${p}"><img src="${frameFor(p)}" alt="cat"><b class="ov ht h1">\u2665</b><b class="ov ht h2">\u2665</b><b class="ov ht h3">\u2665</b><b class="ov sw">\uD83D\uDCA7</b></span>`;
const bear = () => `<svg class="pal" viewBox="0 0 100 100"><g class="bob"><circle class="w b" cx="26" cy="26" r="14"/><circle class="w b" cx="74" cy="26" r="14"/><circle class="w b" cx="50" cy="54" r="36"/><ellipse class="w" cx="50" cy="66" rx="15" ry="11"/><circle cx="38" cy="50" r="3.4" fill="var(--line)"/><circle cx="62" cy="50" r="3.4" fill="var(--line)"/><ellipse cx="50" cy="62" rx="4.5" ry="3.2" fill="var(--line)"/><path class="ln" d="M50 65v3q-4 4-8 1M50 68q4 4 8 1"/><ellipse class="ch" cx="30" cy="62" rx="6" ry="4"/><ellipse class="ch" cx="70" cy="62" rx="6" ry="4"/></g></svg>`;
const bunny = () => `<svg class="pal" viewBox="0 0 100 110"><g class="bob"><ellipse class="w" cx="36" cy="26" rx="10" ry="24"/><ellipse class="w" cx="64" cy="26" rx="10" ry="24"/><ellipse cx="36" cy="28" rx="4.5" ry="16" fill="var(--cheek)"/><ellipse cx="64" cy="28" rx="4.5" ry="16" fill="var(--cheek)"/><circle class="w" cx="50" cy="72" r="32"/><circle cx="39" cy="68" r="3.4" fill="var(--line)"/><circle cx="61" cy="68" r="3.4" fill="var(--line)"/><path class="ln" d="M46 79q4 4 8 0"/><ellipse cx="50" cy="75" rx="3" ry="2.2" fill="var(--cheek)"/><ellipse class="ch" cx="30" cy="78" rx="6" ry="4"/><ellipse class="ch" cx="70" cy="78" rx="6" ry="4"/></g></svg>`;
const box = n => `<button class="gift" data-n="${n}" style="--d:${n * .25}s"><svg viewBox="0 0 80 84"><rect class="gb" x="8" y="34" width="64" height="44" rx="6"/><rect class="rb" x="35" y="34" width="10" height="44"/><g class="lid"><rect class="gb" x="4" y="22" width="72" height="16" rx="5"/><rect class="rb" x="35" y="22" width="10" height="16"/><path class="rb" d="M40 22C28 4 12 14 24 22zM40 22C52 4 68 14 56 22z"/></g></svg>GIFT ${n}<i class="tick">✓</i></button>`;
const lips = [[-8,-8,-20],[30,-14,10],[62,-12,-8],[88,-8,25],[-10,40,-70],[94,50,70],[-8,88,-25],[22,96,15],[52,98,-5],[84,94,20]]
  .map(([x, y, r]) => `<svg class="lip" viewBox="0 0 24 14" style="left:${x}%;top:${y}%;transform:rotate(${r}deg)"><path d="M1 8C5 1 9 2 12 5c3-3 7-4 11 3-4 6-18 6-22 0z"/></svg>`).join("");

/* sound: tiny pop on taps */
let ac, muted = false;
function pop(f = 520) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.8, t + .08);
    g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .15);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(t + .16);
  } catch (e) {}
}
const au = new Audio(); au.loop = true; if (C.song.file) au.src = C.song.file;
$("#mute").onclick = () => { muted = !muted; au.muted = muted; $("#mute").classList.toggle("off", muted); };

/* floating hearts, tap hearts, confetti */
for (let i = 0; i < 6; i++) {
  const h = document.createElement("i"); h.className = "fh"; h.textContent = "♥";
  h.style.cssText = `left:${Math.random() * 100}%;font-size:${10 + Math.random() * 16}px;animation-duration:${9 + Math.random() * 10}s;animation-delay:${-Math.random() * 14}s`;
  $("#bg").append(h);
}
for (let i = 0; i < 3; i++) { const b = document.createElement("i"); b.className = "blob"; b.style.cssText = `width:${160 + i * 50}px;height:${160 + i * 50}px;left:${i * 38}%;top:${10 + i * 28}%;animation-delay:${-i * 4}s`; $("#bg").append(b); }
for (let i = 0; i < 8; i++) { const s = document.createElement("i"); s.className = "st"; s.textContent = "✦"; s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 70}%;font-size:${8 + Math.random() * 10}px;animation-delay:${-Math.random() * 3}s`; $("#bg").append(s); }
/* amped ambience: petals, fireflies, butterflies, shooting stars */
for (let i = 0; i < 8; i++) {
  const p = document.createElement("i"); p.className = "petal"; p.textContent = ["❀", "✿", "♥"][i % 3];
  p.style.cssText = `left:${Math.random() * 100}%;font-size:${10 + Math.random() * 12}px;animation-duration:${9 + Math.random() * 9}s;animation-delay:${-Math.random() * 16}s`;
  $("#bg").append(p);
}
for (let i = 0; i < 4; i++) {
  const f = document.createElement("i"); f.className = "firefly";
  f.style.cssText = `left:${10 + Math.random() * 80}%;top:${20 + Math.random() * 60}%;animation-delay:${-Math.random() * 9}s`;
  $("#bg").append(f);
}
for (let i = 0; i < 2; i++) {
  const b = document.createElement("i"); b.className = "bfly"; b.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 11C7 3 3 5 5 10c1 3 5 2 7 1z" fill="#ff9db8"/><path d="M12 11c5-8 9-6 7-1-1 3-5 2-7 1z" fill="#ff8fb3"/><path d="M12 11C9 17 7 21 10 21c2 0 2-5 2-10z" fill="#f4a3c0"/><path d="M12 11c3 6 5 10 2 10-2 0-2-5-2-10z" fill="#ff9db8"/><rect x="11" y="8" width="2" height="8" rx="1" fill="#5a2a3f"/></svg>';
  b.style.cssText = `left:${20 + i * 55}%;top:${55 + i * 12}%;animation-delay:${-i * 5}s`;
  $("#bg").append(b);
}
setInterval(() => {
  const s = document.createElement("i"); s.className = "shoot";
  s.style.cssText = `left:${55 + Math.random() * 40}%;top:${6 + Math.random() * 18}%`;
  $("#bg").append(s); setTimeout(() => s.remove(), 1200);
}, 7000);
for (let i = 0; i < 2; i++) { const c = document.createElement("i"); c.className = "cloud"; c.style.cssText = `top:${8 + i * 14}%;animation-delay:${-i * 20}s`; $("#bg").append(c); }
let pupilEls = [], lastPupil = "";
addEventListener("pointermove", e => {
  const v = `${((e.clientX / innerWidth - .5) * 6).toFixed(1)},${((e.clientY / innerHeight - .5) * 6).toFixed(1)}`;
  if (v === lastPupil) return; lastPupil = v;
  const [ppx, ppy] = v.split(",");
  pupilEls.forEach(c => c.style.transform = `translate(${ppx}px,${ppy}px)`);
});
addEventListener("pointerdown", e => {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {}
  const h = document.createElement("i"); h.className = "th"; h.textContent = "♥";
  h.style.left = e.clientX + "px"; h.style.top = e.clientY + "px";
  document.body.append(h); setTimeout(() => h.remove(), 900);
});
function burst(x, y, n = 6) {
  for (let i = 0; i < n; i++) setTimeout(() => {
    const h = document.createElement("i"); h.className = "th"; h.textContent = ["♥", "✦"][i % 2];
    h.style.left = x + (Math.random() - .5) * 110 + "px"; h.style.top = y + (Math.random() - .5) * 50 + "px";
    document.body.append(h); setTimeout(() => h.remove(), 900);
  }, i * 70);
}
function confetti() {
  const K = ["#e0497a", "#7fd3a1", "#ffd166", "#ff9db8", "#ffffff"];
  for (let i = 0; i < 40; i++) {
    const b = document.createElement("b"); b.className = "cf";
    b.style.cssText = `background:${K[i % 5]};--x:${(Math.random() - .5) * 340}px;--y:${-120 - Math.random() * 320}px;--r:${Math.random() * 720}deg`;
    if (i % 4 == 0) { b.textContent = "♥"; b.style.color = K[i % 3]; b.style.background = "none"; b.style.fontSize = "18px"; b.style.width = "auto"; }
    document.body.append(b); setTimeout(() => b.remove(), 1500);
  }
}

/* scenes */
const wave = (el, t) => { el.innerHTML = [...t].map((c, i) => c == " " ? " " : `<span class="lw" style="animation-delay:${.3 + i * .035}s">${esc(c)}</span>`).join(""); };
let busy = false;
const go = id => {
  if (busy) return; busy = true; setTimeout(() => busy = false, 1000);
  const w = $("#wipe"); w.classList.remove("run"); void w.offsetWidth; w.classList.add("run");
  setTimeout(() => {
    document.querySelectorAll(".scene").forEach(s => s.classList.toggle("on", s.id === id));
    if (id === "s1" && !tries) wave($("#say"), C.question + " ♥");
    if (id === "s2") wave($("#yl"), C.yesLine + " ♥");
  }, 340);
};
/* generated cat frames (contact sheet, sliced + transparent) */
const IMG = {
  n: "images/cat-n.webp",
  blink: "images/cat-blink.webp",
  hi: "images/cat-hi.webp",
  k: "images/cat-k.webp",
  l: "images/cat-l.webp",
  s: "images/cat-s.webp",
  zz: "images/cat-zz.webp",
  smile: "images/cat-smile.webp",
};
const frameFor = p => ({n:IMG.n,hi:IMG.hi,k:IMG.k,l:IMG.l,s:IMG.s,pn:IMG.s,zz:IMG.zz,smile:IMG.smile}[p] || IMG.n);
function catSrcFor(el) { const c = el.classList; if (c.contains("hi")) return IMG.hi; if (c.contains("zz")) return IMG.zz; if (c.contains("s") || c.contains("pn")) return IMG.s; if (c.contains("l")) return IMG.l; if (c.contains("k")) return IMG.k; if (c.contains("smile")) return IMG.smile; return IMG.n; }
function refreshCat(el) { const im = el.querySelector("img"); if (im) im.src = catSrcFor(el); }
const catObs = new MutationObserver(ms => ms.forEach(m => { if (m.attributeName === "class") refreshCat(m.target); }));
function watchCats(root) { (root || document).querySelectorAll(".cat:not([data-watched])").forEach(el => { el.dataset.watched = "1"; catObs.observe(el, { attributes: true, attributeFilter: ["class"] }); refreshCat(el); }); }
/* blink relay: neutral <-> eyes-closed, only while the cat is idle in normal pose */
setInterval(() => { document.querySelectorAll(".scene.on .cat.n").forEach(el => { if (el.classList.contains("zz") || el.classList.contains("hi")) return; const im = el.querySelector("img"); if (!im) return; im.src = IMG.blink; setTimeout(() => { if (el.isConnected) refreshCat(el); }, 160); }); }, 4200);
const pose = (id, p) => { const c = $(id + " .cat"); c.setAttribute("class", "cat " + p); };
$("#cat0").innerHTML = cat("n"); $("#cat1").innerHTML = cat("n"); $("#cat2").innerHTML = cat("l"); watchCats();
wave($("#hello"), "For " + C.herName); $("#note").textContent = C.openingNote;
wave($("#say"), C.question + " ♥"); $("#yl").textContent = C.yesLine + " ♥";
$("#open").onclick = e => {
  pop(520);
  const r = e.currentTarget.getBoundingClientRect();
  burst(r.x + r.width / 2, r.y + r.height / 2, 10);
  go("s1");
};

/* the YES / NO gag */
let tries = 0;
const yes = $("#yes"), no = $("#no");
no.onclick = () => {
  tries++; pop(260 + tries * 50); const sc = $("#s1"); sc.classList.remove("shake"); void sc.offsetWidth; sc.classList.add("shake");
  const L = C.noLines, i = Math.min(tries - 1, L.length - 1);
  wave($("#say"), L[i]);
  pose("#cat1", ["s", "k", "pn", "s", "k"][Math.min(tries - 1, 4)]);
  yes.style.setProperty("--g", Math.min(tries, 5));
  no.style.transform = `translate(${(Math.random() - .5) * 70}px,${(Math.random() - .5) * 24}px) scale(${Math.max(.35, 1 - tries * .14)})`;
  const r = no.getBoundingClientRect(); burst(r.x + r.width / 2, r.y + r.height / 2, 4);
};
yes.onclick = () => {
  confetti(); setTimeout(confetti, 450); pop(700); pose("#cat1", "l"); wave($("#say"), "Yay!! ♥");
  const f = document.createElement("div"); f.className = "flash"; document.body.append(f);
  requestAnimationFrame(() => f.classList.add("go")); setTimeout(() => f.remove(), 800);
  const r = yes.getBoundingClientRect(); burst(r.x + r.width / 2, r.y + r.height / 2, 12);
  setTimeout(() => go("s2"), 1400);
};

/* gifts */
const done = new Set();
$("#gifts").innerHTML = [1, 2, 3].map(box).join("");
document.querySelectorAll(".gift").forEach(b => b.onclick = () => { b.classList.add("open"); pop(620); confetti(); setTimeout(() => { b.classList.remove("open"); openGift(+b.dataset.n, b); }, 600); });
let tw, fin, nt, playing = false;
function type(el, text, cb) {
  clearInterval(tw); let i = 0;
  fin = () => { clearInterval(tw); el.textContent = text; cb(); };
  tw = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) fin(); }, 30);
}
function togglePlay() {
  playing = !playing; pop(560);
  $("#rec").classList.toggle("spin", playing); $("#arm").classList.toggle("on", playing);
  $("#pp").textContent = playing ? "❚❚" : "▶"; $("#eq").classList.toggle("on", playing); clearInterval(nt);
  if (playing) nt = setInterval(() => { const n = document.createElement("i"); n.className = "nt"; n.textContent = ["♪", "♫"][Math.random() * 2 | 0]; n.style.left = 30 + Math.random() * 40 + "%"; $(".player").append(n); setTimeout(() => n.remove(), 2400); }, 500);
  if (C.song.file) { playing ? au.play().catch(() => {}) : au.pause(); }

/* live "together for" counter */
$("#cl").textContent = C.counterLabel;
function upd() {
  const s = new Date(C.anniversaryDate + "T00:00:00"), n = new Date();
  let y = Math.max(0, n.getFullYear() - s.getFullYear()), a = new Date(s);
  a.setFullYear(s.getFullYear() + y);
  if (a > n) { y = Math.max(0, y - 1); a = new Date(s); a.setFullYear(s.getFullYear() + y); }
  const t = Math.max(0, n - a);
  const u = [[y, y == 1 ? "year" : "years"], [Math.floor(t / 864e5), "days"], [Math.floor(t / 36e5) % 24, "hrs"], [Math.floor(t / 6e4) % 60, "min"], [Math.floor(t / 1e3) % 60, "sec"]];
  $("#cn").innerHTML = u.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");
}
/* cat life: random idle actions, tap reactions, sleepy zzz */
const act = (c, k, ms) => { c.classList.add(k); setTimeout(() => c.classList.remove(k), ms); };
setInterval(() => document.querySelectorAll(".scene.on .cat.n").forEach(c => c.classList.contains("zz") || act(c, ["hi", "hop", "tilt", "smile"][Math.random() * 4 | 0], 1800)), 5000);

document.querySelectorAll("#cat0,#cat1,#cat2").forEach(d => d.onclick = () => {

  }, i * 90);
});
let sl;
const wake = () => { document.querySelectorAll(".cat.zz").forEach(c => c.classList.remove("zz")); clearTimeout(sl); sl = setTimeout(() => document.querySelectorAll(".scene.on .cat.n").forEach(c => c.classList.add("zz")), 9000); };
["pointerdown", "pointermove", "keydown"].forEach(t => addEventListener(t, wake)); wake();
/* 2.5D: characters turn toward your finger, or tilt with your phone (event-driven + slow idle tick, no permanent rAF) */
let tx = 0, ty = 0, cx = 0, cy = 0, lx = "", ly = "";
let lookEls = [];
function refreshLook() { lookEls = [...document.querySelectorAll(".cat,.pal")]; pupilEls = [...document.querySelectorAll(".cat .e.n circle")]; }
function applyLook() {
  cx += (tx - cx) * .08; cy += (ty - cy) * .08;
  const t = performance.now();
  const x = (cx + Math.sin(t / 1100) * .3).toFixed(2), y = (cy + Math.cos(t / 1500) * .2).toFixed(2);
  if (x === lx && y === ly) return; lx = x; ly = y;
  lookEls.forEach(c => { c.style.setProperty("--px", x); c.style.setProperty("--py", y); });
}
const look = (x, y) => { tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y)); applyLook(); };
addEventListener("pointermove", e => look((e.clientX / innerWidth - .5) * 2, (e.clientY / innerHeight - .5) * 2));
addEventListener("deviceorientation", e => e.gamma != null && look(e.gamma / 25, ((e.beta || 55) - 55) / 25));
refreshLook();
setInterval(applyLook, 150);

const reveal = () => {
  if (shown) return; shown = true;
  const w = $("#wipe"); w.classList.add("out"); $("#s0").classList.add("on"); wave($("#hello"), "For " + C.herName);

};
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(reveal, 300));
setTimeout(reveal, 2500);

upd(); setInterval(upd, 1000);
